services:
  # ==================== DATABASES ====================
  user-db:
    image: postgres:16-alpine
    container_name: nexuspay-user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5438:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      

  wallet-db:
    image: postgres:16-alpine
    container_name: nexuspay-wallet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  transaction-db:
    image: postgres:16-alpine
    container_name: nexuspay-transaction-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: nexuspay-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-db:
    image: postgres:16-alpine
    container_name: nexuspay-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: nexuspay-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -Upostgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== INFRASTRUCTURE ====================
  redis:
    image: redis:7-alpine
    container_name: nexuspay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass nexuspay123
    healthcheck:
      test: ["CMD", "redis-cli","-a","nexuspay123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexuspay-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexuspay-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "-w", "2", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexuspay-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== APPLICATION SERVICES ====================
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    container_name: nexuspay-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: nexuspay123
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: wallet-service
    container_name: nexuspay-wallet-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: wallet-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: nexuspay123
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    depends_on:
      wallet-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: transaction-service
    container_name: nexuspay-transaction-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: transaction-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: nexuspay123
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
      KAFKA_BROKER: kafka:9092
    depends_on:
      transaction-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: analytics-service
    container_name: nexuspay-analytics-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      ANALYTICS_DB_HOST: analytics-db
      ANALYTICS_DB_PORT: 5432
      ANALYTICS_DB_USER: postgres
      ANALYTICS_DB_PASSWORD: password
      ANALYTICS_DB_NAME: analytics_db
      KAFKA_BROKER: kafka:9092
    depends_on:
      analytics-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: notification-service
    container_name: nexuspay-notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: nexuspay-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      WALLET_SERVICE_URL: http://wallet-service:3002
      TRANSACTION_SERVICE_URL: http://transaction-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3004
      REDIS_HOST: redis
      REDIS_PORT: 6379  
      REDIS_PASSWORD: nexuspay123

  payment-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-gateway-service
    container_name: nexuspay-payment-gateway-service
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      PORT: 3000

volumes:
  user-db-data:
  wallet-db-data:
  transaction-db-data:
  notification-db-data:
  analytics-db-data:
  payment-db-data:
  redis-data:
  rabbitmq-data: